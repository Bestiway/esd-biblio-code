<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>College Access — Horodatage</title>
<link rel="stylesheet" href="brand.css">
<style>
  /* Carte d'horodatage. Le texte vient de l'URL :
     heure.html?over=IL%20EST&heure=8H&moment=DU%20MATIN                    */
  .accent{ margin-bottom:38px; }
  .over{ font-size:34px; color:var(--ca-red); }

  /* « Data hero number » de la charte : le chiffre porte tout le visuel */
  .heure{
    font-size:240px; font-weight:900; letter-spacing:-.04em; line-height:1;
  }
  /* Contraste de graisses signature : le Thin répond au Black juste au-dessus */
  .moment{ font-size:84px; font-weight:200; letter-spacing:.01em; line-height:1.1; }

  .rule{ width:240px; margin-top:44px; }
</style>
</head>
<body>
  <div class="ca-stage ca-title-block" id="stage">
    <div class="ca-accent accent" id="accent" aria-hidden="true"></div>

    <p class="ca-legible">
      <span class="ca-mask ca-sub over" id="over"><span id="over-txt">IL EST</span></span>
    </p>

    <h1 class="ca-legible">
      <span class="ca-mask heure" id="heure"><span id="heure-txt">8H</span></span>
      <span class="ca-mask moment" id="moment"><span id="moment-txt">DU MATIN</span></span>
    </h1>

    <div class="ca-rule rule" id="rule" aria-hidden="true"></div>
  </div>

<script src="anim.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const p = new URLSearchParams(location.search);

  for (const [cle, id] of [['over', 'over-txt'], ['heure', 'heure-txt'], ['moment', 'moment-txt']]) {
    if (p.get(cle)) $(id).textContent = p.get(cle);
  }

  /* Garde-fou : un horaire long (« 10H30 ») ne doit pas sortir de la safe zone */
  const colonne = $('stage').clientWidth - 96 * 2;
  for (const [id, depart, mini] of [['heure', 240, 120], ['moment', 84, 48]]) {
    for (let taille = depart; taille >= mini; taille -= 2) {
      $(id).style.fontSize = taille + 'px';
      if ($(id + '-txt').scrollWidth <= colonne) break;
    }
  }

  window.CA_DURATION = 4.2;

  CA.drawLine($('accent'), { at: 0.00, dur: 0.70 });
  CA.revealUp($('over'),   { at: 0.14, dur: 0.85 });
  CA.revealUp($('heure'),  { at: 0.28, dur: 1.00 });
  CA.revealUp($('moment'), { at: 0.46, dur: 0.95 });
  CA.drawLine($('rule'),   { at: 0.78, dur: 0.70 });

  CA.fadeOut($('stage'),   { at: 3.60, dur: 0.55 });
</script>
</body>
</html>
