<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>College Access — Les trois piliers</title>
<link rel="stylesheet" href="brand.css">
<style>
  .stage{
    display:flex; flex-direction:column; justify-content:center;
    padding:0 96px;                 /* safe zone latérale 9:16 */
    color:var(--ca-white);
  }

  /* 01 — accent rouge d'ouverture */
  .accent{
    width:132px; height:4px; background:var(--ca-red);
    transform-origin:left center; margin-bottom:46px;
  }

  /* 02 — contraste de graisses signature */
  .l1{ font-size:104px; font-weight:300; letter-spacing:-.01em; line-height:1.14; }
  .l2{ font-size:160px; font-weight:900; letter-spacing:-.035em; line-height:1.06; }

  /* 03 — filet + qualificatif en small caps */
  .rule{
    width:320px; height:2px; background:var(--ca-red);
    transform-origin:left center; margin:54px 0 34px;
  }
  .sub{
    font-size:31px; font-weight:600; letter-spacing:.18em;
    line-height:1.4; text-transform:uppercase;
  }
</style>
</head>
<body>
  <div class="ca-stage stage" id="stage">
    <div class="accent" id="accent" aria-hidden="true"></div>

    <h1 class="ca-legible">
      <span class="ca-mask l1" id="l1"><span>LES TROIS</span></span>
      <span class="ca-mask l2" id="l2"><span>PILIERS</span></span>
    </h1>

    <div class="rule" id="rule" aria-hidden="true"></div>

    <p class="ca-legible">
      <span class="ca-mask sub" id="s1"><span>À BOSSER AVANT</span></span>
      <span class="ca-mask sub" id="s2"><span>DE PRENDRE L'AVION</span></span>
    </p>
  </div>

<script src="anim.js"></script>
<script>
  /* Durée totale de l'animation, lue par le script de rendu */
  window.CA_DURATION = 4.8;

  const $ = (id) => document.getElementById(id);

  /* Cascade haut → bas : chaque ligne entre 0,13 s après la précédente */
  CA.drawLine($('accent'), { at: 0.00, dur: 0.70 });
  CA.revealUp($('l1'),     { at: 0.16, dur: 0.95 });
  CA.revealUp($('l2'),     { at: 0.30, dur: 0.95 });
  CA.drawLine($('rule'),   { at: 0.58, dur: 0.70 });
  CA.revealUp($('s1'),     { at: 0.70, dur: 0.85 });
  CA.revealUp($('s2'),     { at: 0.83, dur: 0.85 });

  /* Sortie propre pour pouvoir enchaîner sur un autre plan */
  CA.fadeOut($('stage'),   { at: 4.20, dur: 0.55 });
</script>
</body>
</html>
