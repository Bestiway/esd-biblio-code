<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>College Access — Les trois piliers</title>
<link rel="stylesheet" href="brand.css">
<style>
  /* Tailles propres à ce titre — le reste vient de brand.css */
  .accent{ margin-bottom:46px; }
  .l1{ font-size:104px; }
  .l2{ font-size:160px; }
  .rule{ width:320px; margin:54px 0 34px; }
  .sub{ font-size:31px; }
</style>
</head>
<body>
  <div class="ca-stage ca-title-block" id="stage">
    <div class="ca-accent accent" id="accent" aria-hidden="true"></div>

    <h1 class="ca-legible">
      <span class="ca-mask ca-light l1" id="l1"><span>LES TROIS</span></span>
      <span class="ca-mask ca-black l2" id="l2"><span>PILIERS</span></span>
    </h1>

    <div class="ca-rule rule" id="rule" aria-hidden="true"></div>

    <p class="ca-legible">
      <span class="ca-mask ca-sub sub" id="s1"><span>À BOSSER AVANT</span></span>
      <span class="ca-mask ca-sub sub" id="s2"><span>DE PRENDRE L'AVION</span></span>
    </p>
  </div>

<script src="anim.js"></script>
<script>
  /* Durée totale de l'animation, lue par le script de rendu */
  window.CA_DURATION = 4.8;

  const $ = (id) => document.getElementById(id);

  /* Cascade haut → bas : chaque ligne entre 0,13 s après la précédente */
  CA.drawLine($('accent'), { at: 0.00, dur: 0.70 });
  CA.revealUp($('l1'),     { at: 0.16, dur: 0.95 });
  CA.revealUp($('l2'),     { at: 0.30, dur: 0.95 });
  CA.drawLine($('rule'),   { at: 0.58, dur: 0.70 });
  CA.revealUp($('s1'),     { at: 0.70, dur: 0.85 });
  CA.revealUp($('s2'),     { at: 0.83, dur: 0.85 });

  /* Sortie propre pour pouvoir enchaîner sur un autre plan */
  CA.fadeOut($('stage'),   { at: 4.20, dur: 0.55 });
</script>
</body>
</html>
