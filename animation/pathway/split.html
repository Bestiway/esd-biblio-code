<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valladolid's Pathway — 16:9 Two Rows</title>
<style>
  @font-face {
    font-family: 'Public Sans';
    src: url('../assets/PublicSans-SemiBold.ttf') format('truetype');
    font-weight: 600;
  }
  @font-face {
    font-family: 'Public Sans';
    src: url('../assets/PublicSans-Bold.ttf') format('truetype');
    font-weight: 700;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1920px; height: 1080px;
    background: transparent;
    overflow: hidden;
    font-family: 'Public Sans', sans-serif;
  }
  svg { display: block; }
  text { font-family: 'Public Sans', sans-serif; }

  /* white text, NO black outlines */
  .title { font-weight: 700; font-size: 56px; fill: #fff; letter-spacing: 0.02em; }

  .rail {
    fill: none; stroke: #03C5FF; stroke-width: 9;
    stroke-linecap: round; stroke-linejoin: round;
    filter: drop-shadow(0 0 16px rgba(3,197,255,0.55));
  }
  .tip-core { fill: #fff; }
  .tip-halo { fill: rgba(3,197,255,0.35); }

  .n-outer { fill: #000938; stroke: #03C5FF; stroke-width: 6; }
  .n-inner { fill: #03C5FF; }

  .s-num   { font-weight: 700; font-size: 30px; fill: #03C5FF; letter-spacing: 0.14em; text-anchor: middle; }
  .s-title { font-weight: 700; font-size: 48px; fill: #fff; text-anchor: middle; }
  .s-desc  { font-weight: 600; font-size: 30px; fill: rgba(255,255,255,0.82); text-anchor: middle; }
</style>
</head>
<body>
<svg width="1920" height="1080" viewBox="0 0 1920 1080">
  <g id="root">
    <g id="titleG">
      <circle cx="112" cy="112" r="62" fill="#fff" stroke="#03C5FF" stroke-width="5"/>
      <image href="../shortlist/valladolid.svg" x="80" y="74" width="64" height="76"/>
      <text class="title" x="200" y="130">Valladolid's Pathway</text>
    </g>

    <path id="rail" class="rail"/>
    <circle id="tipHalo" class="tip-halo" r="26"/>
    <circle id="tipCore" class="tip-core" r="10"/>
    <g id="nodes"></g>
  </g>
</svg>

<script>
/* order follows the snake: top row L->R (01,02,03), bottom row R->L (04,05,06) */
const STEPS = [
  { title: 'Identify',   desc: ['spotted on Eyeball, video', 'and tournaments'],  row: 'top' },
  { title: 'Sign',       desc: ['4–6 week trial', '→ contract'],                  row: 'top' },
  { title: 'U19',        desc: ['Juvenil A: adaptation', 'and first judgment'],   row: 'top' },
  { title: 'Promesas',   desc: ['the B team: real', 'competitive minutes'],       row: 'bot' },
  { title: 'First team', desc: ['La Liga debut', 'and beyond'],                   row: 'bot' },
  { title: 'Resell',     desc: ['move up to a bigger', 'club, fee reinvested'],   row: 'bot' },
];

const COLS = [420, 960, 1500];      /* three columns */
const Y_TOP = 430, Y_BOT = 730;
/* node coords in snake order */
const nodes = [
  { x: COLS[0], y: Y_TOP }, { x: COLS[1], y: Y_TOP }, { x: COLS[2], y: Y_TOP },
  { x: COLS[2], y: Y_BOT }, { x: COLS[1], y: Y_BOT }, { x: COLS[0], y: Y_BOT },
].map((p, i) => ({ ...p, ...STEPS[i], i }));

/* snake path: top L->R, curve down on the right, bottom R->L */
const Lx = 300, Rx = 1500, bulge = 1700;
const railD = `M${Lx},${Y_TOP} H${Rx} C${bulge},${Y_TOP} ${bulge},${Y_BOT} ${Rx},${Y_BOT} H${Lx}`;
document.getElementById('rail').setAttribute('d', railD);

const railEl = document.getElementById('rail');
const LEN = railEl.getTotalLength();

/* find each node's distance along the path */
function lenAt(x, y) {
  let best = 0, bestD = 1e9;
  for (let l = 0; l <= LEN; l += 4) {
    const p = railEl.getPointAtLength(l);
    const d = (p.x - x) ** 2 + (p.y - y) ** 2;
    if (d < bestD) { bestD = d; best = l; }
  }
  return best;
}
nodes.forEach(n => { n.len = lenAt(n.x, n.y); });

const nodesG = document.getElementById('nodes');
const nodeEls = nodes.map(n => {
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  const above = n.row === 'top';
  /* text above the node for the top row, below for the bottom row */
  const numY   = above ? n.y - 196 : n.y + 58;
  const titY   = above ? n.y - 150 : n.y + 104;
  const dY0    = above ? n.y - 104 : n.y + 150;
  const descLines = n.desc.map((line, j) =>
    `<text class="s-desc" x="${n.x}" y="${dY0 + j * 38}">${line}</text>`).join('');
  g.innerHTML = `
    <g class="pop">
      <circle class="n-outer" cx="${n.x}" cy="${n.y}" r="18"/>
      <circle class="n-inner" cx="${n.x}" cy="${n.y}" r="8"/>
    </g>
    <g class="lbl">
      <text class="s-num" x="${n.x}" y="${numY}">0${n.i + 1}</text>
      <text class="s-title" x="${n.x}" y="${titY}">${n.title}</text>
      ${descLines}
    </g>`;
  nodesG.appendChild(g);
  return { g, pop: g.querySelector('.pop'), lbl: g.querySelector('.lbl'), ...n };
});

railEl.style.strokeDasharray = LEN;

const tipCore = document.getElementById('tipCore');
const tipHalo = document.getElementById('tipHalo');
const titleG = document.getElementById('titleG');
const root = document.getElementById('root');

/* ---------------- Easings ---------------- */
const clamp01 = v => Math.max(0, Math.min(1, v));
const easeOutQuint = p => 1 - Math.pow(1 - p, 5);
const easeOutCubic = p => 1 - Math.pow(1 - p, 3);
const easeInOutCubic = p => p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const easeInCubic = p => p * p * p;
const easeOutBack = p => { const c = 1.70158, c3 = c + 1; return 1 + c3 * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const seg = (t, t0, dur, ease) => ease(clamp01((t - t0) / dur));

/* ---------------- Timeline ---------------- */
const TOTAL = 10.3;
const DRAW0 = 0.9, DRAW_DUR = 4.6;
const OUT0 = 9.0;

function seek(t) {
  const gout = seg(t, OUT0, 0.9, easeInCubic);
  root.setAttribute('opacity', (1 - gout).toFixed(3));
  root.setAttribute('transform', `translate(0 ${gout * -40})`);

  const tin = seg(t, 0.05, 0.9, easeOutQuint);
  titleG.setAttribute('opacity', tin.toFixed(3));
  titleG.setAttribute('transform', `translate(${(1 - tin) * -40} 0)`);

  const dp = seg(t, DRAW0, DRAW_DUR, easeInOutCubic);
  railEl.style.strokeDashoffset = LEN * (1 - dp);
  const tipLen = LEN * dp;
  const tip = railEl.getPointAtLength(tipLen);

  const tipOn = dp > 0 && dp < 1 ? 1 : (dp >= 1 ? seg(t, DRAW0 + DRAW_DUR, 0.6, p => 1 - easeOutCubic(p)) : 0);
  const pulse = 1 + 0.18 * Math.sin(t * 5.2);
  tipCore.setAttribute('cx', tip.x); tipCore.setAttribute('cy', tip.y);
  tipHalo.setAttribute('cx', tip.x); tipHalo.setAttribute('cy', tip.y);
  tipCore.setAttribute('opacity', tipOn.toFixed(3));
  tipHalo.setAttribute('opacity', (tipOn * 0.9).toFixed(3));
  tipHalo.setAttribute('r', (26 * pulse).toFixed(1));

  nodeEls.forEach(n => {
    const pPop = dp > 0 ? seg(tipLen, n.len, 100, easeOutBack) : 0;
    const pLbl = dp > 0 ? seg(tipLen, n.len + 20, 130, easeOutCubic) : 0;
    n.pop.setAttribute('transform', `translate(${n.x} ${n.y}) scale(${Math.max(0, pPop)}) translate(${-n.x} ${-n.y})`);
    n.pop.setAttribute('opacity', pPop > 0 ? 1 : 0);
    n.lbl.setAttribute('opacity', pLbl.toFixed(3));
    n.lbl.setAttribute('transform', `translate(0 ${(1 - pLbl) * (n.row === 'top' ? -22 : 22)})`);
  });
}

window.seek = seek;
window.TOTAL = TOTAL;
seek(0);

if (!navigator.webdriver) {
  const start = performance.now();
  (function loop() {
    seek(((performance.now() - start) / 1000) % (TOTAL + 0.8));
    requestAnimationFrame(loop);
  })();
}
</script>
</body>
</html>
