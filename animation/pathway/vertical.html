<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valladolid's Pathway — Vertical 9:16</title>
<style>
  @font-face {
    font-family: 'Public Sans';
    src: url('../assets/PublicSans-SemiBold.ttf') format('truetype');
    font-weight: 600;
  }
  @font-face {
    font-family: 'Public Sans';
    src: url('../assets/PublicSans-Bold.ttf') format('truetype');
    font-weight: 700;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px; height: 1920px;
    background: transparent;
    overflow: hidden;
    font-family: 'Public Sans', sans-serif;
  }
  svg { display: block; }
  text { font-family: 'Public Sans', sans-serif; }

  /* NO black outlines anywhere — white text, cyan accents */
  .title { font-weight: 700; font-size: 62px; fill: #fff; letter-spacing: 0.02em; }

  .rail {
    fill: none; stroke: #03C5FF; stroke-width: 10;
    stroke-linecap: round; stroke-linejoin: round;
    filter: drop-shadow(0 0 18px rgba(3,197,255,0.6));
  }
  .tip-core { fill: #fff; }
  .tip-halo { fill: rgba(3,197,255,0.35); }

  .n-outer { fill: #000938; stroke: #03C5FF; stroke-width: 6; }
  .n-inner { fill: #03C5FF; }

  .s-num   { font-weight: 700; font-size: 34px; fill: #03C5FF; letter-spacing: 0.14em; }
  .s-title { font-weight: 700; font-size: 58px; fill: #fff; }
  .s-desc  { font-weight: 600; font-size: 36px; fill: rgba(255,255,255,0.86); }
</style>
</head>
<body>
<svg width="1080" height="1920" viewBox="0 0 1080 1920">
  <g id="root">
    <g id="titleG">
      <circle cx="120" cy="150" r="74" fill="#fff" stroke="#03C5FF" stroke-width="5"/>
      <image href="../shortlist/valladolid.svg" x="82" y="108" width="76" height="86"/>
      <text class="title" x="228" y="172">Valladolid's</text>
      <text class="title" x="228" y="238">Pathway</text>
    </g>

    <path id="rail" class="rail"/>
    <polyline id="railArrow" class="rail" points=""/>
    <circle id="tipHalo" class="tip-halo" r="28"/>
    <circle id="tipCore" class="tip-core" r="11"/>
    <g id="nodes"></g>
  </g>
</svg>

<script>
/* ---------------- Steps (bottom -> top, climbing) ---------------- */
const STEPS = [
  { title: 'Identify',   desc: ['spotted on Eyeball, video', 'and tournaments (the shortlist)'] },
  { title: 'Sign',       desc: ['4–6 week trial → contract'] },
  { title: 'U19',        desc: ['Juvenil A: adaptation', 'and first judgment'] },
  { title: 'Promesas',   desc: ['the B team: real', 'competitive minutes'] },
  { title: 'First team', desc: ['La Liga debut and beyond'] },
  { title: 'Resell',     desc: ['move up to a bigger club,', 'fee reinvested'] },
];

const RAIL_X = 150;
const Y_BOTTOM = 1740, Y_TOP = 470;
const N = STEPS.length;
const STEP = (Y_BOTTOM - Y_TOP) / (N - 1);   /* vertical gap between nodes */

/* node centres, bottom-to-top */
const nodes = STEPS.map((s, i) => ({ x: RAIL_X, y: Y_BOTTOM - i * STEP, ...s, i }));

/* rail path bottom -> top; extends past the top node so every node reveals
   fully, capped with an up-arrow ("the path keeps going up") */
const RAIL_TOP = Y_TOP - 150;
document.getElementById('rail').setAttribute('d', `M${RAIL_X},${Y_BOTTOM} L${RAIL_X},${RAIL_TOP}`);
const railArrow = document.getElementById('railArrow');
railArrow.setAttribute('points', `${RAIL_X - 26},${RAIL_TOP + 30} ${RAIL_X},${RAIL_TOP} ${RAIL_X + 26},${RAIL_TOP + 30}`);

const nodesG = document.getElementById('nodes');
const nodeEls = nodes.map(n => {
  const tx = 250;                       /* text left, aligned for every step */
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  const descLines = n.desc.map((line, j) =>
    `<text class="s-desc" x="${tx}" y="${n.y + 34 + j * 44}">${line}</text>`).join('');
  g.innerHTML = `
    <g class="pop">
      <circle class="n-outer" cx="${n.x}" cy="${n.y}" r="19"/>
      <circle class="n-inner" cx="${n.x}" cy="${n.y}" r="8"/>
    </g>
    <g class="lbl">
      <text class="s-num" x="${tx}" y="${n.y - 62}">0${n.i + 1}</text>
      <text class="s-title" x="${tx}" y="${n.y - 12}">${n.title}</text>
      ${descLines}
    </g>`;
  nodesG.appendChild(g);
  return { g, pop: g.querySelector('.pop'), lbl: g.querySelector('.lbl'), ...n };
});

const railEl = document.getElementById('rail');
const LEN = railEl.getTotalLength();
railEl.style.strokeDasharray = LEN;

const tipCore = document.getElementById('tipCore');
const tipHalo = document.getElementById('tipHalo');
const titleG = document.getElementById('titleG');
const root = document.getElementById('root');

/* ---------------- Easings ---------------- */
const clamp01 = v => Math.max(0, Math.min(1, v));
const easeOutQuint = p => 1 - Math.pow(1 - p, 5);
const easeOutCubic = p => 1 - Math.pow(1 - p, 3);
const easeInOutCubic = p => p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const easeInCubic = p => p * p * p;
const easeOutBack = p => { const c = 1.70158, c3 = c + 1; return 1 + c3 * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const seg = (t, t0, dur, ease) => ease(clamp01((t - t0) / dur));

/* ---------------- Timeline ---------------- */
const TOTAL = 10.3;
const DRAW0 = 0.9, DRAW_DUR = 4.6;
const OUT0 = 9.0;

function seek(t) {
  const gout = seg(t, OUT0, 0.9, easeInCubic);
  root.setAttribute('opacity', (1 - gout).toFixed(3));
  root.setAttribute('transform', `translate(0 ${gout * -46})`);

  const tin = seg(t, 0.05, 0.9, easeOutQuint);
  titleG.setAttribute('opacity', tin.toFixed(3));
  titleG.setAttribute('transform', `translate(0 ${(1 - tin) * -40})`);

  const dp = seg(t, DRAW0, DRAW_DUR, easeInOutCubic);
  railEl.style.strokeDashoffset = LEN * (1 - dp);
  const tipLen = LEN * dp;
  const tip = railEl.getPointAtLength(tipLen);

  const tipOn = dp > 0 && dp < 1 ? 1 : (dp >= 1 ? seg(t, DRAW0 + DRAW_DUR, 0.6, p => 1 - easeOutCubic(p)) : 0);
  const pulse = 1 + 0.18 * Math.sin(t * 5.2);
  tipCore.setAttribute('cx', tip.x); tipCore.setAttribute('cy', tip.y);
  tipHalo.setAttribute('cx', tip.x); tipHalo.setAttribute('cy', tip.y);
  tipCore.setAttribute('opacity', tipOn.toFixed(3));
  tipHalo.setAttribute('opacity', (tipOn * 0.9).toFixed(3));
  tipHalo.setAttribute('r', (28 * pulse).toFixed(1));

  nodeEls.forEach(n => {
    const nodeLen = n.i * STEP;
    const pPop = dp > 0 ? seg(tipLen, nodeLen, 90, easeOutBack) : 0;
    const pLbl = dp > 0 ? seg(tipLen, nodeLen + 20, 110, easeOutCubic) : 0;
    n.pop.setAttribute('transform', `translate(${n.x} ${n.y}) scale(${Math.max(0, pPop)}) translate(${-n.x} ${-n.y})`);
    n.pop.setAttribute('opacity', pPop > 0 ? 1 : 0);
    n.lbl.setAttribute('opacity', pLbl.toFixed(3));
    n.lbl.setAttribute('transform', `translate(${(1 - pLbl) * 30} 0)`);
  });

  /* arrow appears as the draw completes and stays visible */
  railArrow.setAttribute('opacity', seg(dp, 0.9, 0.1, easeOutCubic).toFixed(3));
}

window.seek = seek;
window.TOTAL = TOTAL;
window.seek(0);

if (!navigator.webdriver) {
  const start = performance.now();
  (function loop() {
    window.seek(((performance.now() - start) / 1000) % (TOTAL + 0.8));
    requestAnimationFrame(loop);
  })();
}
</script>
</body>
</html>
