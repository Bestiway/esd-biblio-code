<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shortlist — Checklist Reveal</title>
<style>
  @font-face {
    font-family: 'Public Sans';
    src: url('../assets/PublicSans-SemiBold.ttf') format('truetype');
    font-weight: 600;
  }
  @font-face {
    font-family: 'Public Sans';
    src: url('../assets/PublicSans-Bold.ttf') format('truetype');
    font-weight: 700;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1920px; height: 1080px;
    background: transparent;
    overflow: hidden;
    font-family: 'Public Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .stage {
    width: 1920px; height: 1080px;
    display: flex; align-items: center; justify-content: center;
  }
  .panel { width: 1400px; }

  /* ---------- Title ---------- */
  .accent {
    width: 92px; height: 8px; border-radius: 4px;
    background: #03C5FF;
    margin-bottom: 24px;
    transform-origin: left center;
    box-shadow: 0 0 18px rgba(3,197,255,0.55);
  }
  .mask { overflow: hidden; }
  .mask > .inner { display: inline-block; will-change: transform; }
  h1 {
    font-weight: 700;
    font-size: 84px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #fff;
    text-shadow: 0 4px 22px rgba(0,9,56,0.5);
    line-height: 1.05;
  }

  /* ---------- Rows ---------- */
  .rows { margin-top: 52px; }
  .row {
    display: flex; align-items: center; gap: 34px;
    padding: 26px 0;
    will-change: transform, opacity;
  }
  .check { width: 64px; height: 64px; flex-shrink: 0; }
  .check svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .check .ring {
    fill: rgba(0,9,56,0.55);
    stroke: #03C5FF; stroke-width: 5;
  }
  .check .tick {
    fill: none; stroke: #03C5FF; stroke-width: 8;
    stroke-linecap: round; stroke-linejoin: round;
    filter: drop-shadow(0 0 10px rgba(3,197,255,0.7));
  }

  .row .text { flex: 1; font-size: 36px; line-height: 1.3; }
  .t-key {
    font-weight: 700; color: #fff; font-size: 38px;
    text-shadow: 0 3px 14px rgba(0,9,56,0.55);
  }
  .t-desc {
    font-weight: 600; color: rgba(255,255,255,0.72);
    font-size: 31px;
    text-shadow: 0 3px 14px rgba(0,9,56,0.55);
  }
  .t-dash { color: #03C5FF; font-weight: 700; padding: 0 10px; }

  .crest {
    width: 104px; height: 104px; flex-shrink: 0;
    background: #fff;
    border: 4px solid #03C5FF;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    will-change: transform, opacity;
    box-shadow: 0 8px 24px rgba(0,9,56,0.45), 0 0 16px rgba(3,197,255,0.35);
  }
  .crest img { width: 66%; height: 72%; object-fit: contain; }
</style>
</head>
<body>
<div class="stage">
  <div class="panel">
    <div class="title-block">
      <div class="accent" id="accent"></div>
      <div class="mask"><div class="inner" id="titleInner"><h1>Shortlist</h1></div></div>
    </div>
    <div class="rows" id="rows"></div>
  </div>
</div>

<script>
const ITEMS = [
  { key: 'Adaptation',               desc: 'settling in fast (residence, language, off-pitch care)' },
  { key: 'Success stories',          desc: "players who've made the same jump before" },
  { key: 'Pathway to the first team', desc: 'a real route up, not a dead end' },
  { key: 'Playing time',             desc: 'minutes, not the bench' },
];

/* ---------------- Build DOM ---------------- */
const rowsEl = document.getElementById('rows');
const rowEls = [], ringEls = [], tickEls = [], crestEls = [];

ITEMS.forEach(it => {
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = `
    <div class="check">
      <svg viewBox="0 0 64 64">
        <circle class="ring" cx="32" cy="32" r="28"/>
        <polyline class="tick" points="19,33 28,43 46,23"/>
      </svg>
    </div>
    <div class="text"><span class="t-key">${it.key}</span><span class="t-dash">—</span><span class="t-desc">${it.desc}</span></div>
    <div class="crest"><img src="valladolid.svg"></div>`;
  rowsEl.appendChild(row);
  rowEls.push(row);
  ringEls.push(row.querySelector('.ring'));
  tickEls.push(row.querySelector('.tick'));
  crestEls.push(row.querySelector('.crest'));
});

/* tick path lengths for draw-on */
tickEls.forEach(el => {
  const L = el.getTotalLength();
  el.style.strokeDasharray = L;
  el.style.strokeDashoffset = L;
  el.dataset.len = L;
});
ringEls.forEach(el => {
  const L = 2 * Math.PI * 28;
  el.style.strokeDasharray = L;
  el.style.strokeDashoffset = L;
  el.dataset.len = L;
});

const accentEl = document.getElementById('accent');
const titleInner = document.getElementById('titleInner');

/* ---------------- Easings ---------------- */
const clamp01 = v => Math.max(0, Math.min(1, v));
const easeOutQuint = p => 1 - Math.pow(1 - p, 5);
const easeOutExpo  = p => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p);
const easeOutCubic = p => 1 - Math.pow(1 - p, 3);
const easeInCubic  = p => p * p * p;
const easeOutBack  = p => { const c = 1.70158, c3 = c + 1; return 1 + c3 * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const seg = (t, t0, dur, ease) => ease(clamp01((t - t0) / dur));

/* ---------------- Timeline ----------------
   0.0–1.0  title
   0.8+     rows slide in (stagger 0.30)
   2.3+     checks tick + crest pops (stagger 0.55)
   hold
   8.8–9.8  out                       total 10.1s */
const TOTAL = 10.1;
const OUT0 = 8.8;
const CHECK0 = 2.3, CHECK_STAG = 0.55;

function seek(t) {
  /* accent + title */
  {
    const pin  = seg(t, 0.0, 0.9, easeOutExpo);
    const pout = seg(t, OUT0 + 0.05, 0.55, easeInCubic);
    accentEl.style.transform = `scaleX(${pin * (1 - pout)})`;
    accentEl.style.opacity = 1 - pout;
    const tin  = seg(t, 0.12, 1.0, easeOutQuint);
    const tout = seg(t, OUT0 + 0.08, 0.6, easeInCubic);
    titleInner.style.transform = `translateY(${115 * (1 - tin) - 115 * tout}%)`;
  }

  ITEMS.forEach((_, i) => {
    const in0 = 0.8 + i * 0.30;
    const out0 = OUT0 + 0.16 + i * 0.13;
    const rin  = seg(t, in0, 0.8, easeOutQuint);
    const rout = seg(t, out0, 0.6, easeInCubic);
    rowEls[i].style.transform = `translateX(${(1 - rin) * 56}px) translateY(${rout * -30}px)`;
    rowEls[i].style.opacity = rin * (1 - rout);

    /* ring draws on with the row, tick + crest arrive at check time */
    const ringP = seg(t, in0 + 0.15, 0.7, easeOutCubic);
    ringEls[i].style.strokeDashoffset = ringEls[i].dataset.len * (1 - ringP);

    const c0 = CHECK0 + i * CHECK_STAG;
    const tickP = seg(t, c0, 0.45, easeOutCubic);
    tickEls[i].style.strokeDashoffset = tickEls[i].dataset.len * (1 - tickP);

    const crestP = seg(t, c0 + 0.08, 0.6, easeOutBack);
    const crestO = seg(t, c0 + 0.08, 0.25, easeOutCubic);
    crestEls[i].style.transform = `scale(${Math.max(0, crestP)}) rotate(${(1 - crestP) * -14}deg)`;
    crestEls[i].style.opacity = crestO * (1 - rout);
  });
}

window.seek = seek;
window.TOTAL = TOTAL;
seek(0);

if (!navigator.webdriver) {
  const start = performance.now();
  (function loop() {
    seek(((performance.now() - start) / 1000) % (TOTAL + 0.8));
    requestAnimationFrame(loop);
  })();
}
</script>
</body>
</html>
