<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WhatsApp Messages — Incoming Interest</title>
<style>
  @font-face {
    font-family: 'Public Sans';
    src: url('../assets/PublicSans-Regular.ttf') format('truetype');
    font-weight: 400;
  }
  @font-face {
    font-family: 'Public Sans';
    src: url('../assets/PublicSans-SemiBold.ttf') format('truetype');
    font-weight: 600;
  }
  @font-face {
    font-family: 'Public Sans';
    src: url('../assets/PublicSans-Bold.ttf') format('truetype');
    font-weight: 700;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1920px; height: 1080px;
    background: transparent;
    overflow: hidden;
    font-family: 'Public Sans', sans-serif;
  }

  .bubble {
    position: absolute;
    max-width: 560px;
    background: #fff;
    border-radius: 14px;
    border-top-left-radius: 4px;
    padding: 14px 20px 12px 20px;
    box-shadow: 0 6px 24px rgba(0,9,56,0.35);
    will-change: transform, opacity;
    transform-origin: 0% 0%;
  }
  /* WhatsApp incoming tail, top-left */
  .bubble::before {
    content: '';
    position: absolute;
    top: 0; left: -14px;
    width: 0; height: 0;
    border-top: 0 solid transparent;
    border-bottom: 18px solid transparent;
    border-right: 16px solid #fff;
  }

  .sender {
    font-weight: 700;
    font-size: 27px;
    margin-bottom: 4px;
  }
  .msg {
    font-weight: 400;
    font-size: 31px;
    color: #111B21;
    line-height: 1.32;
    display: inline;
  }
  .meta {
    display: inline-block;
    font-weight: 400;
    font-size: 22px;
    color: #667781;
    margin-left: 14px;
    transform: translateY(6px);
    white-space: nowrap;
  }
</style>
</head>
<body>
<div id="stage" style="position:relative;width:1920px;height:1080px"></div>

<script>
/* WhatsApp group-chat sender colours */
const COLORS = ['#E542A3', '#1F7AEC', '#00A884', '#FA6533', '#8E44AD', '#D4A017', '#DE3163', '#00A2C7', '#7C9F2F'];

const MESSAGES = [
  { name: 'S. Koné · Player',    msg: 'I would like to join Valladolid', time: '09:12' },
  { name: 'K. Diallo · Agent',   msg: 'My player dreams of La Liga ⚽',  time: '09:14' },
  { name: 'M. Traoré · Agent',   msg: 'Is the trial slot still open?',   time: '09:15' },
  { name: 'A. Ndiaye · Player',  msg: 'Valladolid is the perfect pathway', time: '09:19' },
  { name: 'I. Sarr · Agent',     msg: 'Sending his Eyeball profile now 👀', time: '09:23' },
  { name: 'Y. Camara · Player',  msg: 'Ready for the Promesas minutes',  time: '09:26' },
  { name: 'B. Keita · Agent',    msg: 'He wants the Valladolid project', time: '09:31' },
  { name: 'O. Cissé · Player',   msg: 'When can I start the trial?',     time: '09:34' },
  { name: 'D. Mendy · Agent',    msg: 'Best route to the first team 💯', time: '09:38' },
];

/* scattered positions (top-left of bubble) + slight rotation */
const SPOTS = [
  { x: 150,  y: 95,  r: -2.2 },
  { x: 790,  y: 60,  r:  1.6 },
  { x: 1370, y: 200, r: -1.4 },
  { x: 210,  y: 420, r:  1.8 },
  { x: 860,  y: 380, r: -1.8 },
  { x: 1450, y: 540, r:  2.0 },
  { x: 300,  y: 760, r: -1.6 },
  { x: 960,  y: 730, r:  1.4 },
  { x: 1490, y: 870, r: -2.0 },
];
/* pop order: scattered around the screen, not reading order */
const ORDER = [4, 0, 7, 2, 5, 1, 8, 3, 6];

const stage = document.getElementById('stage');
const els = MESSAGES.map((m, i) => {
  const s = SPOTS[i];
  const el = document.createElement('div');
  el.className = 'bubble';
  el.style.left = s.x + 'px';
  el.style.top = s.y + 'px';
  el.innerHTML = `
    <div class="sender" style="color:${COLORS[i % COLORS.length]}">${m.name}</div>
    <span class="msg">${m.msg}</span><span class="meta">${m.time}</span>`;
  stage.appendChild(el);
  return { el, rot: s.r, i };
});

/* ---------------- Easings ---------------- */
const clamp01 = v => Math.max(0, Math.min(1, v));
const easeOutCubic = p => 1 - Math.pow(1 - p, 3);
const easeInCubic = p => p * p * p;
const easeOutBack = p => { const c = 2.2, c3 = c + 1; return 1 + c3 * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const seg = (t, t0, dur, ease) => ease(clamp01((t - t0) / dur));

/* ---------------- Timeline ----------------
   bubbles pop 0.3 → 4.0 (stagger 0.46)
   gentle float during hold
   out 7.4 → 8.5 (stagger, quick)      total 8.9s */
const TOTAL = 8.9;
const POP0 = 0.3, POP_STAG = 0.46;
const OUT0 = 7.4;

function seek(t) {
  els.forEach(({ el, rot, i }) => {
    const k = ORDER.indexOf(i);
    const t0 = POP0 + k * POP_STAG;
    const pin = seg(t, t0, 0.55, easeOutBack);
    const oin = seg(t, t0, 0.22, easeOutCubic);
    const pout = seg(t, OUT0 + k * 0.09, 0.45, easeInCubic);

    const sc = Math.max(0, pin) * (1 - 0.25 * pout);
    el.style.transform = `rotate(${rot}deg) scale(${sc})`;
    el.style.opacity = (oin * (1 - pout)).toFixed(3);
  });
}

window.seek = seek;
window.TOTAL = TOTAL;
seek(0);

if (!navigator.webdriver) {
  const start = performance.now();
  (function loop() {
    seek(((performance.now() - start) / 1000) % (TOTAL + 0.8));
    requestAnimationFrame(loop);
  })();
}
</script>
</body>
</html>
