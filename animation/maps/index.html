<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Map Reveal — Dots + Counter</title>
<style>
  @font-face {
    font-family: 'Public Sans';
    src: url('../assets/PublicSans-SemiBold.ttf') format('truetype');
    font-weight: 600;
  }
  @font-face {
    font-family: 'Public Sans';
    src: url('../assets/PublicSans-Bold.ttf') format('truetype');
    font-weight: 700;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1920px; height: 1080px;
    background: transparent;
    overflow: hidden;
    font-family: 'Public Sans', sans-serif;
  }
  svg { display: block; }

  #mapGroup { will-change: transform, opacity; }

  .outline {
    fill: none;
    stroke: #fff;
    stroke-width: 6;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 20 16;
  }

  .dot { fill: #12244F; }

  #counter {
    font-weight: 700;
    font-size: 170px;
    fill: #fff;
    text-anchor: middle;
    dominant-baseline: central;
    letter-spacing: 0.01em;
    filter: drop-shadow(0 6px 26px rgba(8,40,80,0.55));
  }
</style>
</head>
<body>
<svg width="1920" height="1080" viewBox="0 0 1920 1080">
  <g id="mapGroup">
    <path id="outline" class="outline"/>
    <g id="dots"></g>
    <text id="counter">0%</text>
  </g>
</svg>

<script src="geo-data.js"></script>
<script>
const params = new URLSearchParams(location.search);
const MAP = params.get('map') || 'spain';
const D = window.GEO[MAP];
if (!D) throw new Error('unknown map: ' + MAP);

const TARGET = D.target;

/* ---------------- Build ---------------- */
document.getElementById('outline').setAttribute('d', D.path);

const counter = document.getElementById('counter');
counter.setAttribute('x', D.label[0]);
counter.setAttribute('y', D.label[1]);

const dotsG = document.getElementById('dots');
const DOT_R = MAP === 'spain' ? 7 : 8;
const dotEls = D.dots.map(([x, y]) => {
  const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  c.setAttribute('cx', x);
  c.setAttribute('cy', y);
  c.setAttribute('r', 0);
  c.setAttribute('class', 'dot');
  dotsG.appendChild(c);
  return c;
});

const group = document.getElementById('mapGroup');
const cx = (D.bounds[0] + D.bounds[2]) / 2;
const cy = (D.bounds[1] + D.bounds[3]) / 2;

/* ---------------- Easings ---------------- */
const clamp01 = v => Math.max(0, Math.min(1, v));
const easeOutQuint = p => 1 - Math.pow(1 - p, 5);
const easeOutCubic = p => 1 - Math.pow(1 - p, 3);
const easeInCubic  = p => p * p * p;
const easeOutBack  = p => { const c = 1.70158, c3 = c + 1; return 1 + c3 * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const seg = (t, t0, dur, ease) => ease(clamp01((t - t0) / dur));

/* ---------------- Timeline ----------------
   0.0 – 0.9   map appears (stitched outline)
   0.7 – 3.9   dots pile up + counter 0 -> TARGET
   hold
   7.6 – 8.5   everything fades out          total 8.8s */
const TOTAL = 8.8;
const COUNT0 = 0.7, COUNT_DUR = 3.2;
const OUT0 = 7.6;

/* reveal: fraction of the dot set shown at the end of the count.
   Spain: uniform dots, 90% of them. Africa: dots are pre-clustered on the
   covered regions, so the whole set appears while the counter reads 40%. */
const shownAtEnd = Math.round(D.dots.length * (D.reveal ?? TARGET / 100));
/* each dot's birth time, following the counter's easing */
const birth = dotEls.map((_, i) => {
  if (i >= shownAtEnd) return Infinity;
  /* invert easeOutCubic: progress at which dot i appears */
  const f = (i + 1) / shownAtEnd;
  const p = 1 - Math.pow(1 - f, 1 / 3);
  return COUNT0 + p * COUNT_DUR;
});

function seek(t) {
  /* map group in/out */
  const gin  = seg(t, 0, 0.9, easeOutQuint);
  const gout = seg(t, OUT0, 0.9, easeInCubic);
  const sc = (0.94 + 0.06 * gin) * (1 + 0.04 * gout);
  group.setAttribute('transform',
    `translate(${cx} ${cy}) scale(${sc}) translate(${-cx} ${-cy})`);
  group.setAttribute('opacity', gin * (1 - gout));

  /* counter */
  const cp = seg(t, COUNT0, COUNT_DUR, easeOutCubic);
  counter.textContent = Math.round(TARGET * cp) + '%';
  counter.setAttribute('opacity', seg(t, COUNT0, 0.4, easeOutCubic));

  /* dots pop in */
  for (let i = 0; i < dotEls.length; i++) {
    const b = birth[i];
    if (t < b) { dotEls[i].setAttribute('r', 0); continue; }
    const pop = seg(t, b, 0.3, easeOutBack);
    dotEls[i].setAttribute('r', (DOT_R * Math.max(0, pop)).toFixed(2));
  }
}

window.seek = seek;
window.TOTAL = TOTAL;
seek(0);

/* live preview in a normal browser */
if (!navigator.webdriver) {
  const start = performance.now();
  (function loop() {
    seek(((performance.now() - start) / 1000) % (TOTAL + 0.8));
    requestAnimationFrame(loop);
  })();
}
</script>
</body>
</html>
